{% extends 'hospital/base.html' %}

{% block content %}

<div class="page-header">
    <h2>Login</h2>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Login
        </button>
    </form>

    <div class="action-buttons">
        <a href="{% url 'signup' %}" class="btn btn-outline">
            Create Account
        </a>
    </div>
</div>

{% endblock %}
