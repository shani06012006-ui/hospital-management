{% extends 'hospital/base.html' %}

{% block content %}
<h2>Patients List</h2>

<div class="action-buttons">
    <a href="{% url 'add_patient' %}" class="btn btn-primary">
        Add Patient
    </a>

    <a href="{% url 'home' %}" class="btn btn-outline">
        Back to Home
    </a>
</div>

<table>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Doctor</th>
        <th>Illness</th>
    </tr>

    {% for patient in patients %}
    <tr>
        <td>{{ patient.name }}</td>
        <td>{{ patient.age }}</td>
        <td>{{ patient.doctor.name }}</td>
        <td>{{ patient.illness }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="4">No patients found.</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
